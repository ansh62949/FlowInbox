apiVersion: v1
kind: ConfigMap
metadata:
  name: flowinbox-config
  namespace: flowinbox
data:
  PROJECT_NAME: "FlowInbox AI"
  API_V1_STR: "/api/v1"
  ENVIRONMENT: "development"
  DEBUG: "true"
  VECTOR_STORE: "qdrant"
  LLM_PROVIDER: "groq"
  LLM_FALLBACK_PROVIDER: "gemini"
  GROQ_MODEL: "llama-3.3-70b-versatile"
  GEMINI_MODEL: "gemini-1.5-flash"
  EMBEDDING_PROVIDER: "fastembed"
  LANGSMITH_PROJECT: "flowinbox-ai"
  FRONTEND_URL: "http://localhost:8080"
  FRONTEND_ORIGINS: '["http://localhost", "http://localhost:8080", "http://localhost:3000", "http://localhost:80"]'
  ALGORITHM: "HS256"
