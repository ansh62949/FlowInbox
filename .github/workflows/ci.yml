name: CI (Continuous Integration)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Pytest & Schema Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'flowinbox/backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r flowinbox/backend/requirements.txt

      - name: Run Pytest Test Suite
        working-directory: flowinbox/backend
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/

  frontend-build:
    name: Frontend Vite Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'flowinbox/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: flowinbox/frontend
        run: npm install

      - name: Build Frontend Production Assets
        working-directory: flowinbox/frontend
        run: npm run build

